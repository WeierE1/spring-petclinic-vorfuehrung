# Nullbedingung nach docs/spec.md Paragraph 34 im Automatisierungs-Repo
# WeierE1/CRA-Private, Issue #10.
#
#   Baut und testet dieses Projekt in der CI gruen, OHNE fremde Zugangsdaten
#   und OHNE private Registry-Zugaenge?
#
# Wenn nicht, kann der Migrations-Agent "Migration noetig" nicht von "Umgebung
# fehlt" unterscheiden - die Vorpruefung gegen den Zielzweig hilft dann nicht,
# weil beide Zweige rot sind.
#
# Das JDK ist FESTGENAGELT. Nicht das, was auf dem Runner zufaellig liegt:
# sonst misst die Nullbedingung den Runner und nicht das Projekt.
name: nullbedingung

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Festgenagelt. 2.7.11 ist die letzte Fassung, die auf JDK 8 laeuft.
  CDX_VERSION: '2.7.11'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # git-commit-id-plugin 2.2.2 laeuft die Historie bis zum naechsten Tag
          # ab. Ein flacher Klon laesst es scheitern - das ist eine Eigenschaft
          # des Klons, nicht des Projekts, und deshalb kein Befund der
          # Nullbedingung.
          fetch-depth: 0

      - name: JDK 8 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Bauen und testen
        run: mvn -B -ntp verify

      # Die Rohdatei mit den Test-Identitaeten fuer das Tor aus Paragraph 24.
      # Auch bei rotem Lauf - das ist genau der Fall, den das Tor untersucht.
      - name: Surefire-XML als Artefakt ablegen
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: warn
          retention-days: 30

      # --- SBOM nach docs/spec.md Paragraph 8, Issue #21 ----------------------
      # CycloneDX AUS DEM BUILD, im selben Lauf und aus denselben Quellen wie
      # das Artefakt. Nicht danach, nicht aus einem Checkout woanders.
      # Gegen den EINGECHECKTEN Abhaengigkeitsstand - ein Generator, der
      # Versionen zur Bauzeit aufloest, erzeugt eine Liste, die spaeter niemand
      # reproduzieren kann, und verfehlt damit den Zweck.
      - name: SBOM erzeugen
        if: always()
        run: |
          mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:${CDX_VERSION}:makeAggregateBom \
            -DoutputDirectory=sbom \
            -DoutputName=bom \
            -DoutputFormat=json \
            -DschemaVersion=1.5 \
            -DincludeTestScope=true
          ls -la sbom

      # --- V8 messen (spec.md Paragraph 35) -----------------------------------
      #   Erzeugt der CycloneDX-Schritt Scope und transitive Komponenten?
      # Nicht annehmen. Paragraph 8.1 verlangt beides: den Scope, weil er in
      # Paragraph 12 die Dringlichkeit lesbar macht, und die transitiven
      # Komponenten, weil Ausgang 3 des Reconcilers sonst kein Material hat.
      - name: V8 messen - Scope und transitive Komponenten
        if: always()
        run: |
          B=sbom/bom.json
          test -f "$B" || { echo "Keine SBOM erzeugt"; exit 1; }
          komponenten=$(grep -oc '"purl"' "$B" || echo 0)
          mit_scope=$(grep -oc '"scope"' "$B" || echo 0)
          direkte=$(grep -c '<dependency>' pom.xml || echo 0)
          hat_graph=$(grep -oc '"dependencies"' "$B" || echo 0)
          {
            echo "## V8 gemessen (spec.md Paragraph 8.1, Paragraph 35)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Komponenten mit \`purl\` | $komponenten |"
            echo "| Eintraege mit \`scope\` | $mit_scope |"
            echo "| \`<dependency>\` im Wurzel-POM | $direkte |"
            echo "| \`dependencies\`-Graph vorhanden | $hat_graph |"
            echo
            if [ "$komponenten" -gt "$direkte" ]; then
              echo "**Transitive Komponenten: ja.** $komponenten Komponenten gegen $direkte"
              echo "direkte Deklarationen im Wurzel-POM."
            else
              echo "**Transitive Komponenten: NEIN.** Nur $komponenten Komponenten bei"
              echo "$direkte direkten Deklarationen - das ist ein Befund fuer die"
              echo "Abdeckungsaussage, kein Grund, es trotzdem zu behaupten."
            fi
            echo
            if [ "$mit_scope" -gt 0 ]; then
              echo "**Scope: ja**, $mit_scope Eintraege tragen ihn."
            else
              echo "**Scope: NEIN.** Damit ist die Dringlichkeitsaussage aus Paragraph 12.1"
              echo "nicht belegbar - gehoert in die Abdeckungsaussage (#30)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # --- Pruefsumme GETRENNT vom Objekt (spec.md Paragraph 13.1) ------------
      # Eine Pruefsumme im eigenen Objekt schuetzt nichts: wer das eine ersetzt,
      # ersetzt das andere mit. Deshalb ein eigenes Integritaetslog mit
      # Objektname, SHA-256, Zeitpunkt und erzeugendem Lauf.
      - name: Pruefsumme getrennt aufzeichnen
        if: always()
        run: |
          test -f sbom/bom.json || exit 0
          {
            echo "objekt=bom.json"
            echo "sha256=$(sha256sum sbom/bom.json | cut -d' ' -f1)"
            echo "groesse=$(stat -c%s sbom/bom.json)"
            echo "commit=${GITHUB_SHA}"
            echo "lauf=${GITHUB_RUN_ID}"
            echo "repo=${GITHUB_REPOSITORY}"
            echo "erzeugt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > sbom/integritaet.properties
          cat sbom/integritaet.properties

      # Die Datei ist das Archiv. Dependency-Track ist die Abfrageschicht
      # darueber und ersetzbar (Paragraph 8.2, Paragraph 13). Deshalb liegt sie
      # hier ab, BEVOR irgendetwas hochgeladen wird - der Upload passiert auf
      # dem Host aus E23, weil DT nur auf 127.0.0.1 hoert.
      - name: SBOM und Integritaetslog als Artefakt ablegen
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sbom
          path: |
            sbom/bom.json
            sbom/integritaet.properties
          if-no-files-found: error
          retention-days: 90
